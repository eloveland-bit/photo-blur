<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Privacy Blur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
--bg:light-dark(#f3f4f2,#141615);--paper:light-dark(#ffffff,#1c1f1e);--ink:light-dark(#1d2021,#e9ecea);--mute:light-dark(#62686b,#a3aaa7);
--line:light-dark(#d9ddda,#323735);--g:#14804a;--gh:#0f6b3d;--bar:#23272a;--stage:#2b2f31}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,"Open Sans",system-ui,-apple-system,Segoe UI,sans-serif;overflow-x:clip}
h1,h2{font-family:Montserrat,Poppins,system-ui,sans-serif;font-weight:700;margin:0;line-height:1.2}
h1{font-size:18px;color:#fff}
h2{font-size:14px;margin-bottom:8px}
.bar{background:var(--bar);color:#c9cfcc;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:10px max(3vw,14px);min-height:60px}
.bar p{margin:0;font-size:13px;flex:1}
button,.btn{font:inherit;font-size:14px;font-weight:500;min-height:40px;padding:0 14px;border-radius:5px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;position:relative}
button:hover:not(:disabled){border-color:var(--mute)}
button:focus-visible,.btn:focus-within,input:focus-visible{outline:2px solid var(--g);outline-offset:2px}
button.primary,.btn.primary{background:var(--g);border-color:var(--g);color:#fff;font-weight:600}
button.primary:hover:not(:disabled),.btn.primary:hover{background:var(--gh)}
.bar .btn{background:#fff;color:#1d2021;border-color:#fff;font-weight:600}
button:disabled{opacity:.4;cursor:default}
.btn input{position:absolute;width:1px;height:1px;opacity:0}
.work{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;padding:16px max(3vw,14px)}
.col{display:flex;flex-direction:column;gap:8px}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tools .seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:auto;background:var(--paper)}
.tools .seg button{padding:0 12px}
.tools kbd{font:11px Inter,sans-serif;opacity:.55}
.size{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.size input{width:120px;accent-color:var(--g)}
.tools .push{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--mute);margin:0;min-height:20px}
.stage{background:var(--stage);border-radius:6px;min-height:420px;display:grid;place-items:center;position:relative;overflow:hidden}
.stage:has(.frame:not([hidden])){min-height:0}
.frame{position:relative;max-width:100%;line-height:0}
.frame canvas{display:block;max-width:100%;max-height:74vh;width:auto;height:auto}
#ov{position:absolute;inset:0;width:100%;height:100%;max-height:none;touch-action:none}
#rm{position:absolute;line-height:1;min-height:32px;padding:0 10px;font-size:13px;background:#fff;color:#1d2021;border-color:#1d2021;transform:translate(-100%,-115%);white-space:nowrap}
.drop{color:#dde2df;text-align:center;padding:40px 24px;max-width:420px;line-height:1.5;border:1px dashed #5b6265;border-radius:6px}
.drop strong{display:block;font:700 18px/1.3 Montserrat,Poppins,sans-serif;margin-bottom:6px;color:#fff}
.drop span{color:#a7afab;font-size:14px}
.stage.over{outline:2px dashed #fff;outline-offset:-8px}
.busy{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.75);color:#fff;font-size:12px;padding:5px 9px;border-radius:4px;line-height:1.3}
.side{background:var(--paper);border:1px solid var(--line);border-radius:6px;align-self:start}
.sec{padding:14px 16px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.chk{display:flex;align-items:flex-start;gap:10px;padding:6px 0;cursor:pointer;font-size:14px}
.chk input{width:17px;height:17px;margin:2px 0 0;accent-color:var(--g);flex:none}
.chk small{display:block;color:var(--mute);font-size:12px;line-height:1.35}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;min-height:36px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.areas{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto}
.areas li{display:flex;align-items:center;gap:8px;min-height:38px;border-top:1px solid var(--line);font-size:14px;cursor:pointer;padding-inline:4px}
.areas li:first-child{border-top:0}
.areas li[aria-selected=true]{background:light-dark(#e9f3ed,#1f3a2b)}
.areas .k{flex:1}
.areas small{color:var(--mute)}
.areas button{min-height:28px;padding:0 8px;font-size:12px}
.empty{color:var(--mute);font-size:13px;margin:0}
.link{border:0;background:none;padding:0;min-height:30px;color:var(--g);font-size:13px;text-decoration:underline}
.acts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.acts .wide{grid-column:1/-1}
.strip{display:flex;gap:8px;overflow-x:auto;padding:0 max(3vw,14px) 20px}
.strip button{flex:none;padding:0;width:104px;height:auto;min-height:0;flex-direction:column;align-items:stretch;gap:0;overflow:hidden;border-radius:4px;border-width:2px}
.strip button[aria-current=true]{border-color:var(--g)}
.strip img{width:100%;height:68px;object-fit:cover;display:block}
.strip span{font-size:11px;padding:3px 6px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute)}
#msg{min-height:18px;font-size:13px;color:var(--mute);margin:0}
@media(max-width:900px){.work{grid-template-columns:minmax(0,1fr)}.stage{min-height:300px}.tools .push{margin-inline-start:0}}
@media(max-width:600px){.tools kbd{display:none}.bar p{flex-basis:100%;order:3}}
</style>
</head>
<body>
<header class="bar">
  <h1>Photo Privacy Blur</h1>
  <p>Runs in your browser. Photos are not uploaded anywhere.</p>
  <label class="btn">Add photos<input id="pick" type="file" accept="image/jpeg,image/png,image/webp" multiple></label>
</header>

<main class="work">
  <div class="col">
    <div class="tools" role="toolbar" aria-label="Editing tools">
      <div class="seg" id="toolSeg">
        <button data-t="select" aria-pressed="true">Select <kbd>V</kbd></button>
        <button data-t="brush" aria-pressed="false">Brush <kbd>B</kbd></button>
        <button data-t="erase" aria-pressed="false">Eraser <kbd>E</kbd></button>
        <button data-t="box" aria-pressed="false">Box <kbd>R</kbd></button>
      </div>
      <label class="size" id="sizeWrap" hidden>Size <input type="range" id="size" min="1" max="100" value="30"></label>
      <div class="push">
        <button id="undo" disabled>Undo</button>
        <button id="redo" disabled>Redo</button>
        <button id="outl" aria-pressed="true">Outlines on</button>
        <button id="hold" disabled>Hold for original</button>
      </div>
    </div>
    <p class="hint" id="hint"></p>
    <section class="stage" id="stage" aria-label="Photo">
      <div class="drop" id="drop"><strong>Drop photos here</strong><span>JPG, PNG or WebP, one or a whole batch. The first photo takes longer while the detection models load.</span></div>
      <div class="frame" id="frame" hidden><canvas id="cv"></canvas><canvas id="ov" aria-label="Photo editing surface"></canvas><button id="rm" hidden>Remove blur</button></div>
      <div class="busy" id="busy" hidden></div>
    </section>
  </div>

  <aside class="side">
    <div class="sec">
      <h2>Find automatically</h2>
      <label class="chk"><input type="checkbox" id="c-text" checked><span>House numbers, plates, signs<small>Any readable text</small></span></label>
      <label class="chk"><input type="checkbox" id="c-vehicle" checked><span>Whole vehicles<small>Unchecked blurs plates only</small></span></label>
      <label class="chk"><input type="checkbox" id="c-face" checked><span>Faces</span></label>
    </div>
    <div class="sec">
      <h2>Blur strength</h2>
      <div class="seg" id="strength"><button data-v="0.75" aria-pressed="false">Subtle</button><button data-v="1" aria-pressed="true">Standard</button><button data-v="1.45" aria-pressed="false">Strong</button></div>
      <label class="chk" style="margin-top:10px"><input type="checkbox" id="c-meta"><span>Keep location data<small>Unchecked removes GPS and other hidden data when saving</small></span></label>
    </div>
    <div class="sec">
      <h2 id="areasTitle">Blur in this photo</h2>
      <ul class="areas" id="areas"></ul>
      <p class="empty" id="noareas">Add a photo to see what was found.</p>
      <button class="link" id="reset" hidden>Start this photo over</button>
    </div>
    <div class="sec acts">
      <button id="save1" class="primary" disabled>Save photo</button>
      <button id="saveAll" disabled>Save all (.zip)</button>
      <p id="msg" class="wide" role="status" aria-live="polite"></p>
    </div>
  </aside>
</main>
<nav class="strip" id="strip" aria-label="Photos in this batch"></nav>

<script type="module">
{
const $ = id => document.getElementById(id);
const VEH = new Set(['car','truck','bus','motorcycle']);
const KIND = {text:'Text', vehicle:'Vehicle', face:'Face', box:'Box', brush:'Brush', erase:'Eraser'};
const AUTO = new Set(['text','vehicle','face']);
const CDN = {
  human: 'https://cdn.jsdelivr.net/npm/@vladmandic/human@3.3.6/dist/human.esm.js',
  models: ['https://vladmandic.github.io/human-models/models/', 'https://cdn.jsdelivr.net/npm/@vladmandic/human-models@3.0.4/models/'],
  ort: 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/',
  text: 'https://cdn.jsdelivr.net/npm/@gutenye/ocr-models@1.4.2/assets/ch_PP-OCRv4_det_infer.onnx'
};
const PREVIEW_MAX = 1800, DET_MAX = 1600, TEXT_MAX = 1536;
const photos = []; let cur = -1, uid = 1, showOrig = false, tool = 'select', sel = null, outlines = true;
const set = {text:true, vehicle:true, face:true, meta:false, strength:1, size:30};
try { Object.assign(set, JSON.parse(localStorage.getItem('ppb-set') || '{}')); } catch (e) {}
const saveSet = () => { try { localStorage.setItem('ppb-set', JSON.stringify(set)); } catch (e) {} };
const msg = t => { $('msg').textContent = t; };
const busy = t => { $('busy').hidden = !t; $('busy').textContent = t || ''; };

/* ---------- models ---------- */
let models = null;
async function loadModels() {
  if (models) return models;
  models = (async () => {
    busy('Loading detection models…');
    let mbase = CDN.models[0];
    try { const r = await fetch(mbase + 'centernet.json', { method: 'HEAD' }); if (!r.ok) throw 0; } catch (e) { mbase = CDN.models[1]; }
    const { default: Human } = await import(CDN.human);
    const human = new Human({
      backend: 'webgl', modelBasePath: mbase, warmup: 'none', cacheSensitivity: 0, async: true,
      filter: { enabled: false }, gesture: { enabled: false }, body: { enabled: false },
      hand: { enabled: false }, segmentation: { enabled: false },
      face: { enabled: true, detector: { modelPath: 'blazeface-back.json', rotation: false, maxDetected: 30, minConfidence: 0.25, return: false },
        mesh: { enabled: false }, attention: { enabled: false }, iris: { enabled: false }, emotion: { enabled: false },
        description: { enabled: false }, antispoof: { enabled: false }, liveness: { enabled: false } },
      object: { enabled: true, modelPath: 'centernet.json', minConfidence: 0.3, maxDetected: 30, iouThreshold: 0.4 }
    });
    await human.load();
    const ort = await import(CDN.ort + 'ort.wasm.min.mjs');
    ort.env.wasm.numThreads = 1;
    ort.env.wasm.wasmPaths = CDN.ort;
    const text = await ort.InferenceSession.create(CDN.text, { executionProviders: ['wasm'] });
    busy('');
    return { human, ort, text };
  })();
  models.catch(e => { models = null; busy(''); msg('Models failed to load: ' + e.message); });
  return models;
}

/* ---------- detection ---------- */
function scaled(src, w, h, max, mult) {
  let s = Math.min(1, max / Math.max(w, h)); let W = Math.round(w * s), H = Math.round(h * s);
  if (mult) { W = Math.max(mult, Math.round(W / mult) * mult); H = Math.max(mult, Math.round(H / mult) * mult); }
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  c.getContext('2d').drawImage(src, 0, 0, W, H); return c;
}
async function detectText(m, bmp, w, h) {
  const c = scaled(bmp, w, h, TEXT_MAX, 32), W = c.width, H = c.height;
  const px = c.getContext('2d').getImageData(0, 0, W, H).data, n = W * H;
  const f = new Float32Array(3 * n), mean = [0.485, 0.456, 0.406], sd =
